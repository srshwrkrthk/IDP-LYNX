[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lynx-gateway"
version = "0.1.0"
description = "LYNX software-first USB HID security gateway and SOC platform"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "email-validator>=2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "PyJWT>=2.9",
    "passlib[bcrypt]>=1.7.4",
    "supabase>=2.7"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6"
]

windows-agent = [
    "wmi>=1.5.1",
    "pywin32>=306",
    "pynput>=1.7.6"
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
