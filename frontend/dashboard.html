<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LYNX Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="dashboard">
        <header>
            <div>
                <h1>LYNX SOC Dashboard</h1>
                <p id="user">Loading account...</p>
            </div>

            <button id="logout">Logout</button>
        </header>

        <section class="stats">
            <div>
                <strong id="endpoint-count">—</strong>
                <span>Online Endpoints</span>
            </div>

            <div>
                <strong id="alert-count">—</strong>
                <span>High-Risk Events</span>
            </div>

            <div>
                <strong id="gateway-status">Loading</strong>
                <span>Gateway Status</span>
            </div>
        </section>

        <section class="activity">
            <div class="section-title">
                <div>
                    <h2>USB Activity</h2>
                    <p>Recent device connections and risk assessments</p>
                </div>

                <button id="refresh">Refresh</button>
            </div>

            <div id="events">
                <p>Loading USB activity...</p>
            </div>
        </section>

        <section class="activity hid-activity">
            <div class="section-title">
                <div>
                    <h2>HID Behaviour Analysis</h2>
                    <p>
                        Privacy-safe keyboard timing and automation detection
                    </p>
                </div>
            </div>

            <div id="hid-events">
                <p>Loading HID analysis...</p>
            </div>
        </section>
    </main>

    <script>
        const token = sessionStorage.getItem("access_token");

        if (!token) {
            window.location.replace("/");
        }

        async function authorizedFetch(url) {
            const response = await fetch(url, {
                headers: {
                    "Authorization": `Bearer ${token}`
                }
            });

            if (response.status === 401 || response.status === 403) {
                sessionStorage.clear();
                window.location.replace("/");
                throw new Error("Session expired");
            }

            if (!response.ok) {
                throw new Error(
                    `Request to ${url} failed with status ${response.status}`
                );
            }

            return response.json();
        }

        function createRiskBadge(level, score) {
            const badge = document.createElement("span");

            const safeLevel = level || "info";

            badge.className = `risk ${safeLevel}`;
            badge.textContent =
                `${safeLevel.toUpperCase()} · ${score ?? 0}`;

            return badge;
        }

        function createUSBEventCard(event) {
            const card = document.createElement("article");
            card.className = "event-card";

            const top = document.createElement("div");
            top.className = "event-top";

            const name = document.createElement("strong");
            name.textContent =
                event.device_name || "Unknown USB Device";

            top.append(
                name,
                createRiskBadge(
                    event.risk_level,
                    event.risk_score
                )
            );

            const details = document.createElement("p");
            details.textContent =
                `${event.event_type} · ` +
                `${event.endpoint_name} · ` +
                `${event.vendor_id || "Unknown vendor"}:` +
                `${event.product_id || "Unknown product"}`;

            const deviceClass = document.createElement("p");
            deviceClass.textContent =
                `Interfaces: ${event.device_class || "Unknown"}`;

            const reasons = document.createElement("p");
            reasons.className = "reasons";
            reasons.textContent =
                (event.risk_reasons || []).join(" • ");

            const time = document.createElement("small");
            time.textContent =
                new Date(event.created_at).toLocaleString();

            card.append(
                top,
                details,
                deviceClass,
                reasons,
                time
            );

            return card;
        }

        function renderUSBEvents(events) {
            const container = document.getElementById("events");
            container.replaceChildren();

            if (!events || events.length === 0) {
                const message = document.createElement("p");
                message.textContent =
                    "No USB activity recorded yet.";

                container.appendChild(message);
                return;
            }

            events.forEach(event => {
                container.appendChild(
                    createUSBEventCard(event)
                );
            });
        }

        function createHIDCard(event) {
            const card = document.createElement("article");
            card.className = "event-card";

            const top = document.createElement("div");
            top.className = "event-top";

            const name = document.createElement("strong");
            name.textContent =
                `HID Analysis · ${event.device_id}`;

            top.append(
                name,
                createRiskBadge(
                    event.risk_level,
                    event.risk_score
                )
            );

            const maximumRate =
                event.max_keys_per_second == null
                    ? 0
                    : Number(event.max_keys_per_second);

            const averageInterval =
                event.average_interval_ms == null
                    ? "N/A"
                    : Number(
                        event.average_interval_ms
                    ).toFixed(2);

            const intervalDeviation =
                event.interval_stddev_ms == null
                    ? "N/A"
                    : Number(
                        event.interval_stddev_ms
                    ).toFixed(2);

            const metrics = document.createElement("p");
            metrics.textContent =
                `${event.key_count} key events · ` +
                `${maximumRate} keys/sec · ` +
                `${event.observation_window_ms} ms window`;

            const timing = document.createElement("p");
            timing.textContent =
                `First input: ` +
                `${event.first_key_delay_ms ?? "None"} ms · ` +
                `Average interval: ${averageInterval} ms · ` +
                `Timing deviation: ${intervalDeviation} ms`;

            const reasons = document.createElement("p");
            reasons.className = "reasons";
            reasons.textContent =
                (event.risk_reasons || []).join(" • ");

            const footer = document.createElement("small");
            footer.textContent =
                `${event.endpoint_name} · ` +
                new Date(event.created_at).toLocaleString();

            card.append(
                top,
                metrics,
                timing,
                reasons,
                footer
            );

            return card;
        }

        function renderHIDEvents(events) {
            const container =
                document.getElementById("hid-events");

            container.replaceChildren();

            if (!events || events.length === 0) {
                const message = document.createElement("p");
                message.textContent =
                    "No HID analysis recorded yet.";

                container.appendChild(message);
                return;
            }

            events.forEach(event => {
                container.appendChild(
                    createHIDCard(event)
                );
            });
        }

        function countHighRisk(events) {
            return events.filter(event =>
                event.risk_level === "high" ||
                event.risk_level === "critical"
            ).length;
        }

        async function loadDashboard() {
            const refreshButton =
                document.getElementById("refresh");

            refreshButton.disabled = true;
            refreshButton.textContent = "Refreshing...";

            try {
                const [
                    user,
                    endpoints,
                    usbActivity,
                    hidActivity
                ] = await Promise.all([
                    authorizedFetch("/auth/me"),
                    authorizedFetch("/endpoints"),
                    authorizedFetch("/events?limit=20"),
                    authorizedFetch("/events/hid?limit=20")
                ]);

                document.getElementById("user").textContent =
                    `Signed in as ${user.email}`;

                const onlineEndpoints = endpoints.filter(
                    endpoint => endpoint.status === "online"
                ).length;

                const alertCount =
                    countHighRisk(usbActivity.events) +
                    countHighRisk(hidActivity.events);

                document.getElementById(
                    "endpoint-count"
                ).textContent = onlineEndpoints;

                document.getElementById(
                    "alert-count"
                ).textContent = alertCount;

                document.getElementById(
                    "gateway-status"
                ).textContent =
                    alertCount > 0
                        ? "Attention"
                        : "Monitoring";

                renderUSBEvents(usbActivity.events);
                renderHIDEvents(hidActivity.events);
            } catch (error) {
                document.getElementById("events").textContent =
                    `Unable to load USB activity: ${error.message}`;

                document.getElementById(
                    "hid-events"
                ).textContent =
                    `Unable to load HID analysis: ${error.message}`;

                document.getElementById(
                    "gateway-status"
                ).textContent = "Unavailable";
            } finally {
                refreshButton.disabled = false;
                refreshButton.textContent = "Refresh";
            }
        }

        document.getElementById(
            "refresh"
        ).addEventListener(
            "click",
            loadDashboard
        );

        document.getElementById(
            "logout"
        ).addEventListener("click", () => {
            sessionStorage.clear();
            window.location.replace("/");
        });

        loadDashboard();
    </script>
</body>
</html>
